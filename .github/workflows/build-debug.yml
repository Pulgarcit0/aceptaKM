name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/prueba-*'

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Aceptar licencias del Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK debug (sin keystore de producción)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Info del APK
        run: |
          ls -la app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aceptakm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
